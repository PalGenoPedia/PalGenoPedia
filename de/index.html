<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- No page was ever published at this URL; it is only reached from stale
     external links and search-engine retries. PalGenoPedia switches language
     in place on one set of URLs, so the canonical is the homepage itself;
     the refresh just adds ?lang=de so a real visitor lands in that language.
     No noindex - it would stop the canonical being read. -->
<title>PalGenoPedia</title>
<link rel="canonical" href="https://palgenopedia.org/">
<meta http-equiv="refresh" content="0; url=/?lang=de">
<meta name="description" content="PalGenoPedia is a single site that switches language in place; there is no separate /de/ path.">
<script>location.replace("/?lang=de" + location.hash);</script>
</head>
<body>
<p>This page has moved to <a href="/?lang=de">PalGenoPedia</a>.</p>
</body>
</html>
