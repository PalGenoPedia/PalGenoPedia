name: Archive source links

# Snapshots every external source URL in the CSVs to the Wayback Machine and
# records the result in data/archived-links.json. Runs weekly (and on demand);
# each run confirms existing captures via the fast CDX API and submits a
# batch of new ones to Save Page Now, so it converges over a few weeks.
#
# Needs repo secrets IA_ACCESS / IA_SECRET — the archive.org "S3-like" keys
# from https://archive.org/account/s3.php. Without them it still works,
# just at the unauthenticated Save Page Now rate limit.

on:
  schedule:
    - cron: '0 4 * * 1'          # Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max new Save Page Now submissions this run (0 = CDX-confirm only)'
        default: '40'
      time_budget:
        description: 'Stop after N seconds and commit progress'
        default: '2400'

concurrency:
  group: archive-links
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # continue-on-error + the always() commit below: a run that dies partway
      # (CDX throttling, the 6h job wall) still persists the progress it made.
      - name: Archive links
        id: archive
        continue-on-error: true
        env:
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
        run: |
          python tools/archive_links.py \
            --limit "${{ github.event.inputs.limit || '40' }}" \
            --time-budget "${{ github.event.inputs.time_budget || '2400' }}"

      - name: Commit progress
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first: data/archived-links.json and data/archive-queue.txt are
          # new (untracked) on the very first run, and `git diff` is blind to
          # untracked files — the check has to be on the index.
          git add data/archived-links.json data/archive-queue.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No archive changes."
            exit 0
          fi
          git commit -m "Archive source links (Wayback)

          Generated by .github/workflows/archive-links.yml. Adding source URLs
          to the CSVs is enough; this backfills their Wayback snapshots."
          git pull --rebase origin main
          git push origin HEAD:main
