name: Archive source links

# Snapshots source URLs to the Wayback Machine and records the result in
# data/archived-links.json. The weekly run is POLICY-DRIVEN: it only touches a
# domain that an editor has configured in data/archive-policy.json (maintained
# from the volunteer portal → "Archive priorities"). Domains set to a non-Wayback
# method are recorded in data/archive-deferred.txt for the ArchiveBox layer;
# unconfigured domains are left alone.
#
# A manual run with mode=full ignores the policy and sweeps every URL.
#
# Needs repo secrets IA_ACCESS / IA_SECRET — the archive.org "S3-like" keys
# from https://archive.org/account/s3.php. Without them it still works,
# just at the unauthenticated Save Page Now rate limit.

on:
  schedule:
    - cron: '0 4 * * 1'          # Monday 04:00 UTC
  push:
    branches: [main]
    paths:
      - 'data/archive-policy.json'   # an editor changed a policy → re-run
      - 'data/media-policy.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'policy-only (obey archive-policy.json) or full (every URL)'
        type: choice
        options: [policy-only, full]
        default: policy-only
      limit:
        description: 'Max new Save Page Now submissions this run (0 = CDX-confirm only)'
        default: '40'
      time_budget:
        description: 'Stop after N seconds and commit progress'
        default: '2400'

concurrency:
  group: archive-links
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # continue-on-error + the always() commit below: a run that dies partway
      # (CDX throttling, the 6h job wall) still persists the progress it made.
      - name: Archive links
        id: archive
        continue-on-error: true
        env:
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
        run: |
          MODE="${{ github.event.inputs.mode || 'policy-only' }}"
          POLICY_FLAG="--policy-only"
          [ "$MODE" = "full" ] && POLICY_FLAG=""
          python tools/archive_links.py $POLICY_FLAG \
            --limit "${{ github.event.inputs.limit || '40' }}" \
            --time-budget "${{ github.event.inputs.time_budget || '2400' }}"

      - name: Commit progress
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first: these files are new (untracked) on the very first run,
          # and `git diff` is blind to untracked files — check the index.
          git add data/archived-links.json data/archive-queue.txt data/media-queue.txt \
                  data/archive-deferred.txt data/source-domains.json data/media-domains.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No archive changes."
            exit 0
          fi
          git commit -m "Archive source links (Wayback)

          Generated by .github/workflows/archive-links.yml from
          data/archive-policy.json. Editors curate which domains get archived
          from the volunteer portal."
          git pull --rebase origin main
          git push origin HEAD:main
