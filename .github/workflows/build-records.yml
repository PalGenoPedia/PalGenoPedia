name: Build record pages

# Regenerates everything derived from the CSVs whenever the source data changes,
# then commits the result back to main. GitHub Pages redeploys from that commit,
# so the published site follows the Sheet without anyone running anything
# locally: the per-record HTML pages, the sitemap, AND the machine-readable
# layer (data/events.json + .csv + .ndjson, the JSON-LD files, feed.xml,
# feed.rss) plus the injected <head> SEO blocks.
#
# Trigger: a push to main that touches a CSV the generator reads, the generator
# itself, or the shared record-page assets. Also runnable by hand from the
# Actions tab (workflow_dispatch) - use that after editing tools/build_records.py
# config, or to force a rebuild.

on:
  push:
    branches: [main]
    paths:
      - 'Pages/War_Crimes_Stats/**/*.csv'
      - 'Pages/Historical_Massacres/pre/*.csv'
      - 'Pages/Historical_Massacres/recent/*.csv'
      - 'tools/build_records.py'
      - 'tools/build_history.py'
      - 'tools/merge_history.py'
      - 'tools/build_sitemap.py'
      - 'tools/regenerate.py'
      - 'tools/seo_inject.py'
      - 'js/record-page.js'
      - 'Styles/record-page.css'
      - 'data/archived-links.json'
      - 'partials/timeline-shell.html'
  workflow_dispatch:

# Let a newer push supersede an in-flight run rather than racing it to commit.
concurrency:
  group: build-records
  # syncAll() in the Apps Script commits each tab separately - up to six per
  # spreadsheet, twenty-four across the four live ones - and every one of those
  # pushes fires this workflow. Queuing them would run the same regeneration
  # two dozen times in a row for one sync. The job rebuilds everything from the
  # CSVs each run, so only the last one matters; earlier ones are superseded.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone is enough; we only ever add one commit on top.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # The generators are stdlib-only on purpose - nothing to install.

      - name: Generate record pages
        run: python tools/build_records.py

      # Historical data lives in two workbooks: pre/ (Nakba→2022) + recent/
      # (Oct 2023→). Concatenate them into the flat Pages/Historical_Massacres/
      # *.csv that build_history.py / regenerate.py / archive_links.py read.
      - name: Merge historical CSVs (pre + recent)
        run: python tools/merge_history.py

      - name: Generate historical event pages
        run: python tools/build_history.py

      # events.json / events.csv / events.ndjson / *.jsonld / feed.xml / feed.rss
      # are all DERIVED from Pages/Historical_Massacres/*.csv here - the Sheet is
      # the only thing anyone edits. Runs after build_history.py because it reads
      # tools/_history_manifest.json to link each event to its generated page.
      - name: Rebuild machine-readable layer (data/, feeds)
        run: python tools/regenerate.py

      # Re-inject the <head> SEO block (canonical, Open Graph, ItemList JSON-LD)
      # into the hand-authored pages - the ItemList is built from the freshly
      # regenerated data/events.json, so this has to run after regenerate.py.
      - name: Inject SEO head blocks
        run: python tools/seo_inject.py

      - name: Rebuild sitemap
        run: python tools/build_sitemap.py

      # Keep the archive dashboard's domain inventory in step with the CSVs,
      # independent of the (policy-driven, weekly) archive run. No network.
      - name: Refresh source-domain inventory
        run: python tools/archive_links.py --domains-only

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nothing to do on a run where the CSVs produced identical output.
          if git diff --quiet; then
            echo "No changes - generated output already matches the data."
            exit 0
          fi

          git add -A
          git commit -m "Rebuild pages, data layer and sitemap from CSV data

          Generated by .github/workflows/build-records.yml from the CSVs in
          this repository (record pages, data/events.*, JSON-LD, feed.xml,
          feed.rss, sitemap, injected SEO blocks). Do not edit the generated
          files by hand - the next run overwrites them."

          # syncAll() fires ~36 commits back-to-back, each triggering this
          # workflow; even with cancel-in-progress the survivor races the tail
          # of that flood and loses the push. Our commit only touches generated
          # output (flat Historical_Massacres/*.csv, data/, HTML) — disjoint
          # from the sync's pre/ recent/ War_Crimes_Stats/ — so the rebase is
          # clean; it's just the fetch→push window. Retry it; if it truly can't
          # land, exit 0 — the next sync-triggered run regenerates the same
          # output from the same CSVs.
          for i in $(seq 1 6); do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; echo "rebase clash on attempt $i"; sleep 15; continue; }
            git push origin HEAD:main && { echo "pushed (attempt $i)"; exit 0; }
            echo "attempt $i lost the race; retrying in 15s"; sleep 15
          done
          echo "::warning::build could not push after 6 tries — next run will pick it up"
          exit 0

      - name: Summary
        if: always()
        run: |
          {
            echo "### Record page build"
            echo ""
            if [ -f tools/_history_manifest.json ]; then
              python - <<'PY'
          import json
          m = json.load(open('tools/_history_manifest.json', encoding='utf-8'))
          print("- **%d historical event pages** generated" % len(m['pages']))
          PY
            fi
            if [ -f tools/_records_manifest.json ]; then
              python - <<'PY'
          import json
          m = json.load(open('tools/_records_manifest.json', encoding='utf-8'))
          pages = m['pages']
          idx = sum(1 for p in pages if p.get('indexable'))
          print("- **%d pages** generated (%d indexable, %d stubs held back)"
                % (len(pages), idx, len(pages) - idx))
          secs = {}
          for p in pages:
              secs.setdefault(p['section'], set()).add(p['id'])
          for s, ids in sorted(secs.items()):
              print("- `%s`: %d records" % (s, len(ids)))
          PY
            else
              echo "- manifest not found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
