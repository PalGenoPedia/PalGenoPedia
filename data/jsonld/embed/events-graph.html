      "articleBody": "The Deir Yassin massacre occurred during intense fighting around Jerusalem in early April 1948 (Operation Nachshon context). The village had previously concluded a local non-aggression understanding with nearby Jewish communities; nonetheless, Irgun and Lehi launched a multi-axis assault at dawn. Haganah/Palmach elements later provided support. Killings of civilians—including women, children and elderly—were documented by Israeli and international witnesses; surviving captives were paraded in Jerusalem and later released. Death estimates vary; most research centers near ≈107, with higher claims (≈200–250) appearing in contemporary accounts. The entire village population (≈710 in 1948) was displaced; Deir Yassin's lands were later absorbed into West Jerusalem neighborhoods. No perpetrators were prosecuted; Irgun commander Menachem Begin later became Prime Minister (1977–1983).",

      "about": {
        "@type": "Event",
        "name": "Tantura",
        "startDate": "1948-05-22",
        "endDate": "1948-05-23",
        "description": "1948 Arab-Israeli War, coastal operations",
        "location": {
          "@type": "Place",
          "name": "Dor Beach area, Haifa District, Israel; Kibbutz Nahsholim built on village ruins; Dor Beach parking lot over mass grave; Village demolished; mass graves undisturbed",
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 32.5167,
            "longitude": 34.9167
          }
        }
      },
      "articleBody": "On May 22-23, 1948, the Alexandroni Brigade of the Haganah (which became the IDF) attacked the Palestinian coastal village of Tantura. The village had a population of approximately 1,500 and was known for its fishing industry. Despite attempts at surrender and raising white flags, Israeli forces conducted house-to-house searches, separated men from women and children, and executed male villagers. An estimated 200-250 Palestinian men were systematically executed after the village surrendered. Bodies were buried in multiple mass graves, including one beneath what is now the parking lot of Dor Beach. The massacre remained largely unknown until 1998 when Israeli graduate student Teddy Katz documented it through interviews with both Palestinian survivors and Israeli soldiers who participated. Despite initial confirmation by veterans, Katz faced a libel lawsuit and was forced under pressure to sign an 'apology' (later withdrawn). Israeli authorities have consistently refused to excavate the mass graves or conduct official investigations. No perpetrators were prosecuted. The village was demolished and Kibbutz Nahsholim was built on its ruins.",
      "keywords": "Massacre, historical, War Crime (1907 Hague); Crimes Against Humanity (modern)",

      "articleBody": "On July 9–13, 1948, during Operation Dani under the command of Yigal Allon (with Yitzhak Rabin as deputy), Israeli forces captured Lydda and Ramle. In Lydda, city-wide shootings killed hundreds of civilians; the Dahmash Mosque massacre alone claimed 70–250+ lives (estimates vary). Moshe Dayan's 89th Battalion participated in ground operations. Immediately after the takeover, expulsion orders were executed: the entire Palestinian populations of both towns—approximately 50,000–70,000 people, including refugees—were forced to march on foot toward Ramallah in extreme July heat. This 'death march' saw numerous deaths from thirst, heat exhaustion, and deprivation; survivors reported infants dying, people chewing grass for moisture, and soldiers preventing access to water. Total deaths are estimated at 400–1,000 (including in-city killings and march fatalities). No perpetrators were prosecuted. Allon became Deputy Prime Minister; Rabin became Prime Minister and Nobel Peace Prize laureate (1994); Dayan became Defense Minister and Foreign Minister. Rabin's memoir passages describing the expulsion order were censored in 1979, later restored.",
      "keywords": "Massacre, Forced Expulsion, Death March, historical, War Crime; Crimes Against Humanity; Ethnic Cleansing (Nakba)",

      "articleBody": "The Qibya massacre occurred during heightened tensions along the Jordan-Israel armistice line. Following the October 12, 1953 killing of an Israeli woman and her two children in Yehud, Israel launched 'Operation Shoshana'—a large-scale reprisal attack on the Jordanian village of Qibya. Unit 101, led by 25-year-old Major Ariel Sharon, attacked with approximately half a battalion of soldiers. After a mortar barrage, demolition squads systematically destroyed homes with inhabitants inside using explosives and grenades. Sharon later wrote the operation was meant to be 'an example for everyone' with orders for 'maximal killing and damage to property.' The UN Mixed Armistice Commission condemned the attack as a breach of the Israel-Jordan armistice agreement. The UN Security Council passed Resolution 101 expressing 'strongest censure.' The US State Department called it 'shocking' and suspended economic aid to Israel. Despite international condemnation, no perpetrators were prosecuted.",

      "headline": "Khan Yunis Massacre",
      "url": "https://palgenopedia.org/historical-events/massacres/khan-yunis-massacre/",
      "datePublished": "1956-11-03",
      "dateModified": "2026-08-27",
      "inLanguage": "en",
      "about": {
        "@type": "Event",
        "name": "Khan Yunis Massacre",
        "startDate": "1956-11-03",
        "endDate": "20771",
        "description": "During Israeli occupation of Gaza in Suez Crisis",
        "location": {
          "@type": "Place",
          "name": "Khan Yunis, Gaza Strip, Palestine; Major city; heavily damaged in 2023-2024 conflict",
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 31.3461,
            "longitude": 34.3063
          }
        }
      },
      "articleBody": "In October-November 1956, Israel launched Operation Kadesh in coordination with France and the UK's invasion of Egypt during the Suez Crisis. Israeli forces rapidly occupied the Gaza Strip and Sinai Peninsula. During the occupation of Gaza, IDF conducted systematic 'screening' operations ostensibly to identify Egyptian soldiers and Palestinian fighters (fedayeen) who had infiltrated Israel. On November 3, 1956, in Khan Yunis and its refugee camp, Israeli forces conducted mass roundups of male residents. During screenings, curfews, and arbitrary detentions, IDF personnel systematically executed civilians. UNRWA Director for Gaza Affairs compiled detailed victim lists and reported to UN General Assembly that 275 men were killed in Khan Yunis and 111 in nearby Rafah. Palestinian sources documented 415 killed with 57 missing. Methods included shooting during curfew, execution after screening, and arbitrary killings. Bodies were buried in mass graves, including in the streets of Khan Yunis. UNRWA provided names, ages, and circumstances of death for verified victims. Despite international documentation and UN reports, no Israeli personnel were prosecuted. Israel withdrew from Gaza in March 1957 under international pressure, particularly from the United States and Soviet Union.",

    {
      "@context": "https://schema.org",
      "@type": "Article",

      "headline": "Six-Day War / Al-Naksa",
      "url": "https://palgenopedia.org/historical-events/massacres/six-day-war-al-naksa/",
      "datePublished": "1967-06-05",
      "dateModified": "2026-08-27",
      "inLanguage": "en",
      "about": {
        "@type": "Event",
        "name": "Six-Day War / Al-Naksa",
        "startDate": "1967-06-05",
        "endDate": "24633",
        "description": "Six-Day War (Israel vs Egypt, Jordan, Syria)",
        "location": {
          "@type": "Place",
          "name": "Occupied Palestinian Territories; Annexed Golan Heights, West Bank and Gaza under Israeli occupation since 1967; East Jerusalem annexed; Golan annexed 1981; Ongoing military occupation; UN recognizes territories as occupied"
        }
      },
      "articleBody": "The Six-Day War erupted on June 5, 1967 when Israel launched preemptive strikes on Egyptian airfields, followed by ground operations. Within six days, Israel occupied the Egyptian-controlled Gaza Strip and Sinai Peninsula, Jordanian-controlled West Bank and East Jerusalem, and Syrian Golan Heights. The rapid Israeli victory fundamentally transformed the Israeli-Palestinian conflict by bringing all of historic Palestine under Israeli control. Mass displacement began immediately. As Israeli forces advanced into the West Bank, panic spread among Palestinians remembering the 1948 Nakba. Estimates of those who fled or were expelled range from 280,000 (Israeli sources) to 400,000+ (Palestinian and UN sources). Approximately 175,000 were refugees from 1948 being displaced a second time. The displacement was not solely a byproduct of combat—Israeli authorities issued military orders preventing return and systematically demolished entire villages. Three villages in the Latrun area (Imwas, Yalo, and Beit Nuba) were completely destroyed by Israeli forces, their 10,000 residents expelled. In Jerusalem's Old City, the Moroccan Quarter was bulldozed days after occupation to create a plaza at the Western Wall. UN Security Council Resolution 242 called for 'withdrawal of Israeli armed forces from territories occupied' and for 'achieving a just settlement of the refugee problem,' but Israel has maintained occupation for over 55 years. The 1967 displacement and subsequent occupation created the framework for the current Israeli-Palestinian conflict.",

      "@context": "https://schema.org",

      "headline": "Sabra and Shatila",
      "url": "https://palgenopedia.org/historical-events/massacres/sabra-and-shatila/",

      "dateModified": "2026-08-27",
      "inLanguage": "en",
      "about": {
        "@type": "Event",
        "name": "Sabra and Shatila",
        "startDate": "1982-09-16",
        "endDate": "30212",
        "description": "During Israeli occupation of West Beirut, Lebanon War",
        "location": {
          "@type": "Place",
          "name": "Sabra and Shatila, Beirut, Lebanon; Camps still exist; memorial sites established",
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 33.8547,
            "longitude": 35.4881
          }
        }
      },
      "articleBody": "The Sabra and Shatila massacre occurred during Israel's 1982 invasion of Lebanon ('Operation Peace for Galilee'). After the assassination of Lebanese President-elect Bachir Gemayel on September 14, 1982, Israeli Defense Minister Ariel Sharon ordered IDF forces to occupy West Beirut, ostensibly to maintain order. On September 16, Sharon authorized Lebanese Phalangist militias to enter the Sabra and Shatila Palestinian refugee camps, claiming they would 'mop up' remaining PLO fighters—though PLO forces had evacuated weeks earlier under international agreement. For approximately 40 hours (September 16-18), Phalangist militiamen systematically killed Palestinian civilians, including women, children, and elderly persons. Israeli forces surrounded the camps, controlled all entry and exit points, provided logistical support, and fired illumination flares throughout the nights allowing the killings to continue after dark. Israeli commanders received reports of civilian massacres but did not intervene. Methods included shooting, stabbing, decapitation, mutilation. Bodies were dumped in mass graves or left in streets. The exact death toll remains disputed. Lebanon's official investigation documented approximately 800 killed; the Palestinian Red Crescent estimated 3,500; various international sources cite 2,000-3,500. The Israeli Kahan Commission investigated and found Defense Minister Sharon bore 'personal responsibility' for the massacre, recommending his removal. Sharon resigned as Defense Minister but remained in cabinet without portfolio, later serving as Israeli Prime Minister (2001-2006). Multiple international legal attempts to prosecute him failed.",

        "location": {

          "name": "Occupied Palestinian Territories, West Bank under Israeli military occupation; Gaza under blockade since 2007, Continued occupation; First Intifada led to Oslo Accords and creation of Palestinian Authority",

      "articleBody": "On December 8, 1987, an Israeli army truck collided with civilian vehicles at the Erez checkpoint in Gaza, killing four Palestinian workers from Jabalia refugee camp. Palestinians believed it was deliberate revenge for the stabbing death of an Israeli in Gaza two days earlier. The following day, December 9, massive protests erupted in Jabalia. When 17-year-old Hatem al-Sisi was shot dead by Israeli soldiers, the uprising exploded across Gaza, East Jerusalem, and the West Bank within days. What began as spontaneous protests transformed into organized, sustained civil resistance coordinated by grassroots committees and later by the United National Leadership of the Uprising (UNLU). The Intifada was characterized by largely non-violent tactics: general strikes, tax resistance, boycotts of Israeli products, and civil disobedience. Palestinian youth confronted Israeli soldiers with stones and Molotov cocktails. The Israeli response was brutal. Defense Minister Yitzhak Rabin issued orders to use 'force, might, and beatings' and to 'break bones' of demonstrators. Soldiers systematically beat protesters, fired live ammunition at stone-throwers, and used tear gas extensively. In the first year alone, Israeli forces killed at least 300 Palestinians and wounded tens of thousands. By 1990, the death toll exceeded 1,000. The uprising exacted an enormous toll: 1,087-1,284 Palestinians killed (including 241-332 children), over 120,000 wounded, approximately 20,000 arrested in the first year alone (with estimates reaching 120,000 total over six years), 2,532 homes demolished, and 481 Palestinians deported. Approximately 160-200 Israelis (soldiers and civilians) were killed during the same period. International condemnation was swift—the UN Security Council condemned Israel's response, and even the Reagan Administration criticized the 'harsh security measures and excessive use of live ammunition.' The Intifada forced recognition of Palestinian national aspirations, led to the Madrid Conference (1991) and secret Oslo negotiations, culminating in the September 1993 Oslo Accords which created the Palestinian Authority and promised future statehood—though these promises remain unfulfilled over 30 years later.",

        "location": {

          "name": "Hebron Old City, West Bank, H2 area under full Israeli military control since 1997 Hebron Protocol; Ibrahimi Mosque divided 60% for Jews, 40% for Muslims since massacre; Old City strangled by checkpoints, closures, settler violence",

      "articleBody": "Baruch Goldstein was born Benjamin Carl Goldstein in Brooklyn, New York in 1956 to an Orthodox Jewish family. In the 1970s, he became a charter member of the Jewish Defense League (JDL), a militant organization founded by Rabbi Meir Kahane. After graduating from Yeshiva University's Albert Einstein College of Medicine, Goldstein emigrated to Israel in 1983. He served as a physician in the Israel Defense Forces and later settled in Kiryat Arba, an extremist settlement adjacent to Hebron. Goldstein was an active member of Kach, Kahane's ultranationalist party, and was third on its list for the 1984 Knesset elections. Israeli press reported that Goldstein refused to treat Arabs, even Arab soldiers serving in the IDF, believing it violated Jewish religious law to treat non-Jews. He compared Israel's democracy to Nazism and wore a yellow star marked 'JUDE' in protest. In the weeks before the massacre, Goldstein made ominous statements and was involved in violent incidents at the mosque, including pouring acid on carpets. Palestinian authorities wrote to Prime Minister Rabin warning about Goldstein's dangerous behavior, but no action was taken. On the morning of February 25, 1994, the 15th day of Ramadan, worshippers noticed the unusual absence of Israeli soldiers from their normal positions around the Ibrahimi Mosque despite tensions the previous evening. At approximately 5:30 AM, as Imam Khalil Muhsen Jabari led hundreds in Fajr (dawn) prayer, Goldstein entered the Isaac Hall—the main prayer area—dressed in his IDF reserve uniform and carrying a Galil assault rifle and pistol. He positioned himself behind a pillar at the rear of the hall. When worshippers prostrated (sujood position), Goldstein opened fire. He reloaded multiple times, methodically shooting prostrate worshippers who were trapped and defenseless. Survivors report the shooting continued for ten minutes. Some eyewitnesses claim they saw additional gunmen, though Israeli investigations denied this. When worshippers finally overcame Goldstein, they beat him to death. By then, 29 Palestinians lay dead—including children as young as 11—and 125 were wounded. The horror did not end with the shooting. Israeli soldiers present at the mosque closed the gates, trapping survivors inside with the dead and wounded, and preventing medical help from entering. When the gates finally opened, Israeli forces fired on protesters outside, killing more Palestinians. Over the next three weeks, as news of the massacre spread, Palestinians rioted throughout Hebron and the West Bank. Israeli forces killed at least 25 more Palestinians during these protests, including at victims' funerals. The total death toll reached 50-60. Israel's response was to punish the victims: a six-month closure of Hebron; formation of the one-sided Shamgar Commission whose recommendations all favored settlers; partition of the Ibrahimi Mosque giving 60% to Jews (who comprised 0.003% of Hebron's population); closure of 520 businesses and 1,800 shops in the Old City; sealing of Shuhada Street (the main commercial artery); and a network of military checkpoints suffocating Palestinian life. The massacre achieved Goldstein's goal: it did not stop Oslo, but it transformed Hebron into a strangled city, its Old City a ghost town, its Palestinian population subjected to daily humiliation while a few hundred extremist settlers lived under heavy military protection.",

    {
      "@context": "https://schema.org",
      "@type": "Article",
      "@id": "https://palgenopedia.org/data/events.json#hist010",
      "headline": "Second Intifada",
      "url": "https://palgenopedia.org/historical-events/massacres/second-intifada/",
      "datePublished": "2000-09-28",
      "dateModified": "2026-08-27",
      "inLanguage": "en",
      "about": {
        "@type": "Event",
        "name": "Second Intifada",
        "startDate": "2000-09-28",
        "endDate": "38717",
        "description": "Collapse of Camp David peace talks; Ariel Sharon's provocative Temple Mount visit",
        "location": {
          "@type": "Place",
          "name": "Occupied Palestinian Territories and Israel, West Bank under Israeli military occupation with PA limited control; Gaza under blockade; Second Intifada led to Israeli disengagement from Gaza (2005), construction of separation barrier, and collapse of peace process"
        }
      },
      "articleBody": "The Second Intifada's immediate trigger was Ariel Sharon's September 28, 2000 visit to the Temple Mount/Haram al-Sharif, accompanied by 1,000 Israeli police. Palestinians viewed this as deliberate provocation at one of Islam's holiest sites by a figure they associated with past massacres (Sabra and Shatila 1982, Qibya 1953). Protests erupted immediately. The next day, September 29 (a Friday), after prayers at Al-Aqsa Mosque, Israeli police fired on Palestinian demonstrators, killing 7 and wounding over 300. By October 1, violence had spread throughout the occupied territories and into Israel. Thirteen Palestinian citizens of Israel were shot dead by Israeli police during protests inside Israel proper. Within two weeks, 100 Palestinians and 10 Israelis had been killed. The uprising's deeper causes lay in the failure of the Oslo peace process: seven years after Oslo, Palestinians remained under occupation, settlements had doubled, movement restrictions had increased, and statehood seemed further away than ever. Unlike the First Intifada's stones and civil disobedience, the Second Intifada quickly became armed conflict. Palestinian militant groups—Hamas, Islamic Jihad, Al-Aqsa Martyrs' Brigades (affiliated with Fatah), and PFLP—launched devastating suicide bombing campaigns targeting Israeli civilians in buses, restaurants, markets, and nightclubs. The peak came in March 2002 with the Passover massacre at Park Hotel in Netanya (30 killed), triggering Israel's massive Operation Defensive Shield. Israel responded with overwhelming military force: helicopter gunships, F-16 fighter jets, tanks, and bulldozers deployed in densely populated Palestinian areas. Targeted assassinations by helicopter missile strikes often killed bystanders. Entire cities were placed under curfew for months. The 2002 siege of Jenin refugee camp became emblematic: Israeli forces demolished 140+ buildings, killed 52 Palestinians (23 civilians), and faced international accusations of war crimes. By the Second Intifada's end in late 2005, the toll was catastrophic: 3,223-4,789 Palestinians killed (including 700+ children, 47% civilians); 1,024-1,100 Israelis killed (including 300+ children, 64% civilians); 45,000+ Palestinians wounded; 7,500+ Israelis wounded; approximately 40,000-50,000 Palestinians imprisoned; and massive infrastructure destruction. Israel unilaterally withdrew from Gaza in August 2005 while accelerating settlement expansion in the West Bank. The separation barrier was constructed—declared illegal by the International Court of Justice—confiscating thousands of acres of Palestinian land. The Second Intifada destroyed what remained of the peace process, entrenched the occupation, empowered Hamas, and created the siege of Gaza. It established patterns that continue today: Palestinian resistance met with disproportionate Israeli force; suicide bombings used to justify collective punishment; negotiated peace deemed impossible. The human cost was immense on both sides, but the political outcome was clear: Israeli control deepened while Palestinian freedom receded further.",

      "@context": "https://schema.org",
      "@type": "Article",
      "@id": "https://palgenopedia.org/data/events.json#hist011",
      "headline": "Battle of Jenin",
      "url": "https://palgenopedia.org/historical-events/massacres/battle-of-jenin/",
      "datePublished": "2002-04-03",
      "dateModified": "2026-08-27",
      "inLanguage": "en",
      "about": {
        "@type": "Event",
        "name": "Battle of Jenin",
        "startDate": "2002-04-03",
        "endDate": "37357",
        "description": "Part of Operation Defensive Shield; response to Passover massacre (27 March 2002)",
        "location": {
          "@type": "Place",
          "name": "Jenin Refugee Camp, West Bank, Under Israeli military occupation; PA has limited security control; Camp rebuilt but remains flashpoint; frequent Israeli military raids; site of ongoing violence",
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 32.4644,
            "longitude": 35.2956
          }
        }
      },
      "articleBody": "Jenin refugee camp was established in 1953 to house Palestinians displaced during the 1948 Nakba, primarily from Haifa and surrounding villages. By 2002, approximately 14,000 refugees lived in the densely packed camp covering just one square kilometer. Under the Oslo Accords, Jenin came under full Palestinian Authority control in 1995 (Area A). However, the camp became a stronghold for Palestinian militant groups during the Second Intifada. According to both Israeli and Palestinian sources, an estimated 80-100 armed fighters from Hamas, Islamic Jihad, Al-Aqsa Martyrs' Brigades, and Tanzim operated from the camp. Israel claimed 28 suicide attacks between October 2000 and April 2002 were planned and launched from Jenin. After the devastating Passover massacre at Park Hotel in Netanya killed 30 Israeli civilians on March 27, 2002, the Israeli government launched Operation Defensive Shield—the largest military operation in the West Bank since 1967. Jenin refugee camp was identified as a primary target. On April 3, 2002, approximately 200 Israeli tanks surrounded Jenin refugee camp. Apache helicopters and F-16 fighter jets provided air support. The IDF's stated objective was to 'destroy the operational infrastructure of militant organizations' and capture or kill those responsible for suicide bombings. Palestinian militants had anticipated the assault and extensively prepared the camp's defense: they planted dozens of explosive charges in water pipes, kitchen cabinets, doorways, and streets; created booby traps throughout the camp; fortified positions in buildings; and prepared ambush sites. The IDF began house-to-house searches, advancing slowly through narrow alleys. On April 9, the sixth day of the operation, 13 Israeli soldiers were killed in a devastating ambush—Palestinian fighters lured an IDF unit into a narrow alley and detonated massive explosives, collapsing buildings on the soldiers. This was the deadliest single incident for the IDF during the entire Second Intifada. Following this catastrophic loss, Israeli military tactics changed dramatically. After the April 9 ambush, the IDF deployed massive American-made Caterpillar D-9 armored bulldozers—60-ton machines with armor plating that could demolish multi-story buildings in minutes. Rather than continuing dangerous house-to-house combat, bulldozers began systematically demolishing buildings to create wide paths for tanks and to eliminate potential ambush sites. Human Rights Watch investigators documented that bulldozers demolished over 140 buildings, destroying approximately 10% of the entire camp's structures. Many buildings were demolished with families still trapped inside—some residents were crushed to death, others buried alive in rubble. The IDF enforced total siege: no one allowed in or out; medical access blocked for 11 days (April 4-15); ambulances fired upon; water and electricity cut off; food prevented from entering. Farwa Jammal, a 27-year-old uniformed nurse, was shot dead by IDF fire while treating a wounded civilian. At least two injured civilians died because Israeli soldiers prevented ambulances from reaching them for over 36 hours. When Human Rights Watch investigators finally gained access on April 19, they found scenes of massive destruction: entire neighborhoods reduced to rubble, bodies still buried under collapsed buildings, and evidence of willful killings. Their 52-page report concluded: 'Israeli forces committed serious violations of international humanitarian law, some amounting prima facie to war crimes.' The UN attempted to launch an investigation, but Israel blocked the fact-finding mission. Final toll: 52 Palestinians killed (22 civilians—including a 14-year-old boy, wheelchair-bound elderly man, and women), 23 Israeli soldiers killed, over 140 buildings demolished, 4,000 people rendered homeless.",
      "keywords": "Military Operation / Urban Warfare, historical, War Crimes (HRW prima facie); Violations of IHL",

      "about": {

        "name": "Operation Cast Lead",
        "startDate": "2008-12-27",
        "endDate": "39831",
        "description": "22-day Israeli military operation in Gaza Strip",
        "location": {
          "@type": "Place",
          "name": "Gaza Strip, Under Israeli blockade and occupation; governed by Hamas, Ongoing blockade since 2007; reconstruction incomplete",
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 31.5,
            "longitude": 34.47

      "articleBody": "Operation Cast Lead began at 11:30 AM on December 27, 2008, when Israeli F-16 fighter jets and Apache helicopters simultaneously struck over 100 pre-planned targets across Gaza within 220 seconds. The opening attacks hit police stations—including during a graduation ceremony for new officers, killing 99 police personnel—government buildings, and Hamas infrastructure. By the end of the first day, at least 230 Palestinians were killed. The aerial bombardment continued for seven days before Israeli ground forces invaded Gaza from the north and east on January 3, 2009. The navy simultaneously shelled from offshore. Over 22 days, Israeli forces conducted what the UN investigation described as a deliberately disproportionate attack designed to punish, humiliate and terrorize a civilian population. The operation involved widespread destruction of civilian infrastructure including hospitals, schools, mosques, United Nations facilities, water installations, and sewage treatment plants. Multiple incidents documented by the UN mission and human rights organizations revealed patterns of violations: the Samouni family massacre where soldiers forced approximately 100 civilians into a building then shelled it killing 21; the Al-Daya family airstrike killing 22 civilians; several cases where soldiers shot civilians carrying white flags; and extensive use of white phosphorus munitions in densely populated areas. The Palestinian Centre for Human Rights documented 1,419 Palestinian deaths including 1,167 civilians, while B'Tselem reported 1,385 killed including 762 noncombatants and 318 minors.",

      "about": {
        "@type": "Event",
        "name": "Operation Pillar of Defense",
        "startDate": "2012-11-14",
        "endDate": "41234",
        "description": "Escalation following targeted killing of Hamas military commander",
        "location": {
          "@type": "Place",
          "name": "Gaza Strip; Palestinian territory, Israeli-occupied since 1967, Hamas-governed since 2007; Under blockade; subject to recurring Israeli military operations",
          "geo": {

            "latitude": 31.5017,
            "longitude": 34.4668
          }

      },
      "articleBody": "On November 14, 2012, at approximately 15:45, the Israeli Air Force assassinated Ahmed al-Jabari, head of Hamas's military wing, marking the start of Operation Pillar of Defense. Over eight days, the IDF struck approximately 1,500 targets across Gaza—including underground rocket launchers, arms-smuggling tunnels, weapons storage facilities, and residences of Hamas officials. Unlike Operation Cast Lead (2008-09), no ground incursion occurred. According to B'Tselem's field investigations published May 2013, the operation killed 167 Palestinians: at least 87 civilians who did not participate in hostilities (52%), including 32 children; 62 combatants; 7 targets of assassinations; and 11 of unknown status. The UN Protection Cluster documented over 11,100 injuries, including 3,374 children. Analysis reveals 80% of civilian deaths occurred in the final four days, when the ratio of civilian to combatant deaths reversed sharply. Six Israelis died from Palestinian rocket fire: four civilians and two security personnel. Palestinian groups fired 1,667 rockets toward Israel (ISA figures); 436 were intercepted by Iron Dome. Hamas also executed at least 6-7 Palestinians accused of collaboration during the operation. B'Tselem investigated nine specific incidents raising 'grave suspicions' of IHL violations, including attacks killing children working in fields, families in homes without warnings, and civilians during Arab foreign ministers' visit. The IDF Spokesperson initially admitted 'probable error' in strike killing 12 members of al-Dalu family, but MAG Corps later closed case without prosecution.",

      "about": {
        "@type": "Event",
        "name": "Operation Protective Edge",
        "startDate": "2014-07-07",
        "endDate": "41877",
        "description": "51-day Israeli military operation in Gaza Strip; deadliest Gaza conflict",
        "location": {
          "@type": "Place",
          "name": "Gaza Strip, Under Israeli blockade; governed by Hamas; Reconstruction incomplete; ongoing blockade; infrastructure severely damaged"
        }
      },
      "articleBody": "Operation Protective Edge began on July 7, 2014, ostensibly in response to escalating rocket fire from Gaza, but in a context of heightened tensions following the abduction and murder of three Israeli teenagers in the West Bank in June. Israel launched massive airstrikes across Gaza, conducting over 6,000 air raids in 51 days. The operation had three phases: an initial week of intensive aerial bombardment, a ground invasion beginning July 17 aimed at destroying cross-border tunnels, and a final phase from August 5 characterized by alternating ceasefires and continued strikes. The stated objectives were to stop rocket attacks and destroy Hamas's military infrastructure and tunnel network. The human toll was unprecedented. The UN Commission of Inquiry documented 2,251 Palestinian deaths, with 1,462 identified as civilians—65% of all deaths. Among the dead were 551 children and 299 women. Entire families were wiped out in single strikes: 18 members of the Al-Batsh family killed on July 13, 17 members of the Abu Jame family on July 20, 26 members of the Al-Najjar family on July 20. The Commission investigated 15 cases of attacks on residential buildings and found that in many instances there was no evidence of a legitimate military target, or the attacks were grossly disproportionate. B'Tselem documented 606 attacks on residential buildings killing 1,447 civilians. The percentage of women among civilian deaths (20.2%) was significantly higher than in previous operations. Several specific incidents stood out for their brutality. On July 19-20, Israeli forces launched a massive assault on Shuja'iya, one of Gaza's most densely populated neighborhoods. Over 100 Palestinians were killed in approximately 24 hours as Israeli artillery fired thousands of shells into residential areas. Witnesses described civilians being shot while attempting to flee with white flags. On August 1, after an Israeli soldier was reportedly captured in Rafah, Israel invoked the Hannibal Directive—calling for overwhelming force without regard for civilian life. In three hours, Israeli forces fired over 1,000 artillery shells into Rafah, killing 130-150 Palestinians, overwhelmingly civilians. The UN described this as a 'moral outrage and a criminal act.' The systematic destruction of Gaza's infrastructure was also staggering: Gaza's only power plant destroyed, 18,000 homes razed, 89,000 damaged, 73 medical facilities attacked, 262 schools damaged. The UN Commission concluded there was evidence indicating serious violations of international humanitarian law amounting to war crimes by Israeli forces, including deliberate attacks on civilians and civilian infrastructure. The Commission also found Palestinian armed groups committed war crimes through indiscriminate rocket attacks and the extrajudicial execution of 21 alleged collaborators. On the Israeli side, 73 people died: 67 soldiers and 6 civilians killed by rockets and mortars.",
      "keywords": "Military Operation, historical, War Crimes; Crimes Against Humanity (UN Commission of Inquiry 2015)",

      "articleBody": "The Great March of Return began on March 30, 2018—Palestinian Land Day and the 42nd anniversary of mass protests against Israeli land confiscation. Organized by independent activists, the protests were conceived as peaceful demonstrations to draw international attention to Gaza's humanitarian crisis, the blockade, and the right of return for Palestinian refugees. Five designated protest sites were established along Gaza's eastern border, several hundred meters from the separation fence. The protests were intended to last from Land Day (March 30) through Nakba Day (May 15), but continued for 21 months until Hamas announced their end on December 27, 2019. Israel's response was immediate and lethal. Israeli Defense Forces deployed snipers along the fence with rules of engagement permitting use of live ammunition against protesters. On the opening day, March 30, 2018, Israeli forces killed 18 Palestinians and shot over 700 with live ammunition. The bloodiest day came on May 14, 2018—the day the US Embassy officially opened in Jerusalem—when Israeli forces killed 60 Palestinians and shot over 1,100. By December 31, 2018, Israeli snipers had shot 6,106 Palestinians with live ammunition, killing 183 during official protest days. Thirty-five were children, three were clearly marked paramedics, and two were clearly marked journalists. Another 3,098 Palestinians were injured by bullet fragmentation, rubber-coated metal bullets, or tear gas canisters. The UN Commission of Inquiry investigated every killing at the designated demonstration sites on official protest days between March 30 and December 31, 2018. Commissioners reviewed video evidence, medical records, ballistics reports, and conducted extensive interviews. Their finding was damning: with the exception of two incidents, the Commission found reasonable grounds to believe the use of live ammunition was unlawful. The victims 'were neither participating directly in hostilities nor posing an imminent threat' when shot. Commissioner Sara Hossain stated: 'There can be no justification for killing and injuring journalists, medics, and persons who were clearly not posing an imminent threat of death or serious injury.' The Commission concluded the pattern of violations may constitute war crimes or crimes against humanity. Notable victims included 21-year-old paramedic Razan al-Najjar, shot and killed while treating wounded protesters despite wearing a clearly marked white medical vest, and journalist Yaser Murtaja, shot dead while wearing press insignia. By the time protests ended in December 2019, 223 Palestinians had been killed and 28,939 injured. At least 122 Palestinians required limb amputations including 20 children. Israel has conducted no meaningful investigations, with all but a handful of cases closed without indictment.",

      "about": {

        "description": "11-day Israeli military operation in Gaza Strip",
        "location": {
          "@type": "Place",
          "name": "Gaza Strip, Under Israeli blockade; governed by Hamas, Blockade ongoing; reconstruction incomplete",

      "articleBody": "The escalation that became Operation Guardian of the Walls was rooted in events in Jerusalem. During Ramadan 2021, Israeli police erected barriers preventing Palestinians from gathering at Damascus Gate—a traditional gathering place—and violently suppressed protests. Simultaneously, Israeli courts moved forward with eviction proceedings against Palestinian families in the Sheikh Jarrah neighborhood of East Jerusalem to make way for Jewish settlers. On May 7, hundreds of Palestinians were injured when Israeli police stormed Al-Aqsa Mosque compound during prayers, firing rubber bullets, stun grenades, and tear gas inside the mosque itself. International condemnation was swift, but on May 10—Lailat al-Qadr, the holiest night of Ramadan—Israeli police again raided Al-Aqsa, injuring over 300 Palestinians. Hamas issued an ultimatum demanding Israeli forces withdraw from Al-Aqsa and Sheikh Jarrah by 6 PM. When Israel refused, Hamas and Palestinian Islamic Jihad fired rockets toward Jerusalem at 6:05 PM, marking the beginning of the conflict. Israel's response was immediate and overwhelming. Within hours, Israeli jets struck over 130 targets across Gaza. Over the next 11 days, the IDF conducted more than 1,500 airstrikes while Palestinian armed groups fired 4,360 rockets and mortars into Israel—the Iron Dome intercepted approximately 90% of projectiles headed toward populated areas. The first day saw the al-Masri family strike in Beit Hanoun where a missile killed 8 civilians including 6 children who were packing barley for animal feed. Israel claimed it was a misfired Palestinian rocket, but Human Rights Watch's investigation found evidence of a guided missile and no military target. The deadliest single incident came on May 16 when Israeli forces launched a four-minute assault on al-Wahda Street in central Gaza City, causing three multi-story residential buildings to collapse. Forty-four civilians were killed including 18 children. HRW found the buildings collapsed after missiles struck the road or sidewalk adjacent to them—there were no evident military targets. The operation took place against the backdrop of Israel's 14-year blockade of Gaza and its systematic discrimination against Palestinians, which Human Rights Watch had characterized as apartheid just one month earlier in April 2021. The 11-day conflict killed 260 Palestinians (129 civilians according to UN/HRW, though Israel claimed most were militants). Thirteen Israelis died including 12 civilians killed by rockets. Human Rights Watch conducted in-depth investigations of three Israeli strikes that killed 62 Palestinian civilians total, finding 'no evident military targets in the vicinity' of any—constituting apparent war crimes. A third incident HRW investigated was the May 15 bombing of a building in Shati refugee camp that killed 10 people (8 children, 2 women); Israel claimed senior Hamas officials were hiding there, but HRW found no evidence of military targets. The report also documented that Palestinian armed groups committed war crimes through indiscriminate rocket fire at Israeli population centers. The operation ended with an Egyptian-mediated ceasefire on May 21, but neither side achieved strategic objectives, and Gaza's humanitarian crisis deepened significantly.",

      "@context": "https://schema.org",
      "@type": "Article",

      "headline": "West Bank Raids 2022–2023",
      "url": "https://palgenopedia.org/historical-events/massacres/west-bank-raids-20222023/",
      "datePublished": "2022-01-01",

      "about": {
        "@type": "Event",
        "name": "West Bank Raids 2022–2023",
        "startDate": "2022-01-01",
        "endDate": "45291",
        "description": "Two-year period of intensified Israeli military operations in West Bank",
        "location": {
          "@type": "Place",
          "name": "West Bank, Under Israeli military occupation; Areas A, B, C division under Oslo Accords; Ongoing occupation; violence escalated significantly"
        }
      },
      "articleBody": "The escalation began in spring 2022 following a series of attacks by Palestinians inside Israel that killed 19 Israelis between March 22 and May 7. Israel responded by launching 'Operation Break the Wave'—near-nightly military raids into West Bank cities and refugee camps, particularly Jenin and Nablus. These cities had become centers of renewed armed Palestinian resistance with the emergence of groups like the Jenin Brigades (founded September 2021), the Lions' Den in Nablus, and the Balata Brigades. The Israeli operations involved massive deployments of troops, bulldozers destroying infrastructure and roads, use of live ammunition in densely populated areas, and increasingly, aerial bombardment including drone strikes. By the end of 2022, 220 Palestinians had been killed including 48 children—the highest annual toll since the Second Intifada ended in 2005. The violence was not limited to armed confrontations. According to Middle East Eye's analysis, the majority of Palestinian casualties in 2022 were likely unarmed at the time of their death. At least 95 Palestinians were shot by Israeli soldiers as bystanders during army raids or while participating in anti-occupation demonstrations. Seven women and girls were killed, including 15-year-old Jana Zakarneh shot twice in the face while playing with her cat on her rooftop, and 15-year-old Fulla al-Masalma killed a day before her birthday. The most internationally significant killing was that of Shireen Abu Akleh, Al Jazeera's veteran Palestinian correspondent, shot in the head on May 11, 2022 while covering a raid in Jenin. Despite wearing a clearly marked PRESS vest and standing with other journalists, Abu Akleh was killed by Israeli fire. The UN Commission of Inquiry investigated and concluded 'on reasonable grounds that Israeli forces used lethal force without justification under international human rights law and, intentionally or recklessly, violated Abu Akleh's right to life.' The violence intensified further in 2023. In January, a raid on Jenin killed 10 Palestinians including a 61-year-old woman shot through the neck while watching from her bedroom window. In February, 11 Palestinians were killed in Nablus including civilians shot in the back while fleeing. In July, Israel conducted its largest West Bank operation in 20 years—a 14-hour assault on Jenin refugee camp using drones, helicopter gunships, and hundreds of troops, killing 12 and forcing 500 families to flee. By December 2023, Doctors Without Borders declared it 'the deadliest year for Palestinians in the West Bank in recorded history' with 507 killed including 127 children. The UN Commission found Israeli forces systematically violated international law by applying combat rules to law enforcement situations, using disproportionate force, failing to distinguish between civilians and combatants, obstructing medical care, and conducting what amounted to extrajudicial executions. Meanwhile, settler violence also surged—the UN recorded over 800 settler attacks on Palestinians between October 2022 and May 2024, often occurring with Israeli military acquiescence or participation.",
